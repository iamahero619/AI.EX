<canvas id="interactive-canvas"></canvas>

<div class="hud-ui">
    <div><b>[SYS]</b> NEURAL MANIFOLD: <span id="node-count">100</span> NODES</div>

</div>

<div class="terminal-overlay">
    <h1>AI.EX</h1>
    <p style="font-family: 'JetBrains Mono'; color: #444; letter-spacing: 12px; margin-bottom: 30px;">CALIBRATION TERMINAL</p>
    <a href="./ai.html" class="enter-btn">ENTER VAULT</a>
</div>

<script>
    const canvas = document.getElementById('interactive-canvas');
    const ctx = canvas.getContext('2d');
    const nodeDisplay = document.getElementById('node-count');
    let width, height, particles = [];
    let mouse = { x: -1000, y: -1000 };

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor(x, y) {
            this.x = x || Math.random() * width;
            this.y = y || Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.size = Math.random() * 2 + 0.5;
        }
        update() {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 180) {
                this.x -= dx * 0.02;
                this.y -= dy * 0.02;
            }
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
            ctx.fillStyle = "rgba(0, 234, 255, 0.7)";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function init() {
        resize();
        particles = Array.from({ length: 120 }, () => new Particle());
        animate();
    }

    function animate() {
        ctx.fillStyle = 'rgba(2, 4, 8, 0.15)';
        ctx.fillRect(0, 0, width, height);
        nodeDisplay.innerText = particles.length;

        particles.forEach((p, i) => {
            p.update();
            p.draw();
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dx = p.x - p2.x;
                let dy = p.y - p2.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 130) {
                    ctx.strokeStyle = `rgba(0, 234, 255, ${1 - dist/130})`;
                    ctx.lineWidth = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        });
        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', e => {
        for(let i=0; i<8; i++) particles.push(new Particle(e.clientX, e.clientY));
        if(particles.length > 250) particles.splice(0, 8);
    });
    window.addEventListener('resize', resize);
    init();
</script>
